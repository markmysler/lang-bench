# Settings come from the environment the orchestrator sets (docs/SPEC.md).
server.port=${PORT:8080}
spring.main.banner-mode=off

# Virtual threads: Tomcat runs each request on a new virtual thread instead of its worker pool.
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bench}
spring.datasource.username=${DB_USER:bench}
spring.datasource.password=${DB_PASSWORD:bench}
# HikariCP: a fixed pool of DB_POOL connections (Hikari's default and recommendation is
# minimum-idle = maximum-pool-size). The pool is created on first use, and -1 means it never fails
# for a missing database, so the server starts and serves other workloads without one.
spring.datasource.hikari.maximum-pool-size=${DB_POOL:16}
spring.datasource.hikari.initialization-fail-timeout=-1
