[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

# Exact versions are pinned in Cargo.lock; the Dockerfile builds with --locked.
[dependencies]
axum = "0.8.9"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time"] }
