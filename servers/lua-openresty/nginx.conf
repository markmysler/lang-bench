# OpenResty server for lang-bench (docs/SPEC.md). start.sh fills in @CPUS@ and @RESOLVER@.
worker_processes @CPUS@;
error_log stderr warn;
pid /tmp/nginx.pid;

# nginx clears the environment of its workers; these are kept for app.lua.
env CPUS;
env DB_HOST;
env DB_PORT;
env DB_USER;
env DB_PASSWORD;
env DB_NAME;
env DB_POOL;

events {
    worker_connections 4096;
}

http {
    access_log off;
    # The other servers never close a keep-alive connection after a number of requests (nginx
    # does after 1000 by default), so neither does this one.
    keepalive_requests 1000000;
    resolver @RESOLVER@ ipv6=off;
    lua_package_path "/app/?.lua;;";

    # Load the app (and cjson, pgmoon) once in the master, so workers fork with it ready.
    init_by_lua_block { require "app" }
    init_worker_by_lua_block { require("app").init_worker() }

    server {
        # reuseport gives each worker its own listening socket; the kernel spreads connections.
        listen 8080 reuseport;

        location = /health    { default_type text/plain;       content_by_lua_block { require("app").health() } }
        location = /plaintext { default_type text/plain;       content_by_lua_block { require("app").plaintext() } }
        location = /json      { default_type application/json; content_by_lua_block { require("app").json() } }
        location = /cpu       { default_type application/json; content_by_lua_block { require("app").cpu() } }
        location = /io        { default_type application/json; content_by_lua_block { require("app").io() } }
        location = /db        { default_type application/json; content_by_lua_block { require("app").db() } }
        location = /queries   { default_type application/json; content_by_lua_block { require("app").queries() } }
        location /            { return 404; }
    }
}
