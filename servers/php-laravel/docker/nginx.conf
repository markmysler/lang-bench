user www-data;
# Replaced with CPUS by the entrypoint.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    server_tokens off;
    default_type application/octet-stream;
    # nginx closes a keep-alive connection after 1000 requests by default; the other servers have
    # no such limit, so it is raised out of the way.
    keepalive_requests 1000000;

    # The site from Laravel's deployment guide, without the static-file parts.
    server {
        listen 8080 default_server;
        root /app/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }
    }
}
