; Loaded after the image's www.conf, docker.conf and zz-docker.conf, so these settings win.
[www]
; nginx talks to PHP-FPM over a unix socket in the same container.
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; A fixed number of children, 8 per CPU, set by the entrypoint from CPUS.
pm = static
pm.max_children = ${FPM_CHILDREN}
